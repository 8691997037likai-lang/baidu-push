name: Baidu Push

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Push to Baidu
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, requests
          token = os.environ['BAIDU_TOKEN']
          site = 'jingsxians.cn'

          all_urls = set()

          # 抓文章列表页
          list_url = 'https://jingsxians.cn/articles.html'
          resp = requests.get(list_url)
          html = resp.text
          found = re.findall(r'href="(https://jingsxians\.cn/articles/[^"]+\.html)"', html)
          all_urls.update(found)

          # 抓首页和其他主要页面
          main_pages = [
              'https://jingsxians.cn/',
              'https://jingsxians.cn/start.html',
              'https://jingsxians.cn/ask.html',
              'https://jingsxians.cn/tradition-research.html',
              'https://jingsxians.cn/modern-research.html',
              'https://jingsxians.cn/posts.html',
              'https://jingsxians.cn/research.html',
              'https://jingsxians.cn/research-results.html',
              'https://jingsxians.cn/data.html',
          ]
          all_urls.update(main_pages)

          urls = sorted(all_urls)

          if not urls:
              print('No URLs found.')
              exit(0)

          print(f'Total URLs: {len(urls)}')

          api = f'http://data.zz.baidu.com/urls?site={site}&token={token}'
          for i in range(0, len(urls), 200):
              batch = urls[i:i+200]
              data = '\n'.join(batch)
              r = requests.post(api, data=data.encode('utf-8'), headers={'Content-Type': 'text/plain'})
              print(f'Batch {i//200 + 1}: {r.text}')
          PY
